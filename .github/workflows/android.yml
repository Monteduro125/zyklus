name: Android-App bauen

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Tests der Zykluslogik
        run: npm test

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      # Das Android SDK ist auf den GitHub-Runnern vorinstalliert (ANDROID_HOME).
      - name: APK bauen
        working-directory: android
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          gradle assembleRelease --no-daemon

      - name: APK umbenennen
        run: cp android/app/build/outputs/apk/release/app-release.apk zyklus.apk

      - uses: actions/upload-artifact@v4
        with:
          name: zyklus-apk
          path: zyklus.apk

      # Auf main: als Release „latest“ veröffentlichen, damit der Download-Link immer gleich bleibt.
      - name: Release aktualisieren
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest zyklus.apk \
            --title "Zyklus Android-App (Build ${{ github.run_number }})" \
            --notes "Neueste Version. Auf dem Handy herunterladen und öffnen, um zu installieren oder zu aktualisieren."
